name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  teleq-mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test mcp/test/*.test.mjs
